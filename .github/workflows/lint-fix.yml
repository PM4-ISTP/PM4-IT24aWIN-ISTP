name: Auto-Fix Lint & Format

on:
  push:
    branches-ignore:
      - main
      - deploy-staging
      - deploy-prod

# Skip if the push was made by the bot itself (avoids infinite loop)
jobs:
  auto-fix:
    name: Auto-Fix Prettier & Spotless
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      # ── Frontend: Prettier ──────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Prettier on failing files only
        working-directory: frontend
        run: |
          # List files that don't match formatting, then write-fix only those
          FILES=$(npx prettier --list-different . 2>/dev/null || true)
          if [ -n "$FILES" ]; then
            echo "Fixing formatting in:"
            echo "$FILES"
            echo "$FILES" | xargs npx prettier --write
          else
            echo "All files already formatted correctly."
          fi

      # ── Backend: Spotless ───────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Make Gradle wrapper executable
        working-directory: backend
        run: chmod +x gradlew

      - name: Run Spotless apply
        working-directory: backend
        run: ./gradlew spotlessApply

      # ── Commit & push if anything changed ───────────────────────────────────
      - name: Commit and push fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to fix – all good!"
          else
            git commit -m "ci(fix): auto-fix prettier & spotless [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
