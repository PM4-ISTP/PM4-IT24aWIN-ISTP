name: Auto-Fix Lint & Format

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    # Only react to CI runs on feature branches, not on protected branches
    branches-ignore:
      - main
      - deploy-staging
      - deploy-prod

jobs:
  auto-fix:
    name: Auto-Fix Prettier & Spotless
    runs-on: ubuntu-latest
    # Only run when CI actually failed and the failure was NOT caused by our own bot commit
    # (the second condition prevents an infinite loop)
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.actor.login != 'github-actions[bot]'
    permissions:
      contents: write

    steps:
      - name: Checkout failing branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      # ── Frontend: Prettier fix ──────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Prettier fix
        working-directory: frontend
        run: |
          FILES=$(npx prettier --list-different . 2>/dev/null || true)
          if [ -n "$FILES" ]; then
            echo "Fixing formatting in:"
            echo "$FILES"
            echo "$FILES" | xargs npx prettier --write
          else
            echo "All files already formatted correctly."
          fi

      # ── Backend: Spotless fix ───────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Make Gradle wrapper executable
        working-directory: backend
        run: chmod +x gradlew

      - name: Run Spotless apply
        working-directory: backend
        run: ./gradlew spotlessApply

      # ── Commit & push if anything changed ───────────────────────────────────
      - name: Commit and push fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to fix – all good!"
          else
            git commit -m "ci(fix): auto-fix prettier & spotless"
            git push origin HEAD:${{ github.event.workflow_run.head_branch }}
          fi

      # ── Verify: run checks again so the result is visible here ─────────────
      - name: Verify – Prettier check
        working-directory: frontend
        run: npx prettier --check .

      - name: Verify – Spotless check
        working-directory: backend
        run: ./gradlew spotlessCheck
