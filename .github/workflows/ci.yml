name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run format:check

      - name: ESLint check
        run: npm run lint

  backend-lint-and-format:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Spotless format check
        run: ./gradlew spotlessCheck

      - name: Checkstyle
        run: ./gradlew checkstyleMain

      - name: PMD (warn only)
        run: ./gradlew pmdMain

      - name: SpotBugs (warn only)
        run: ./gradlew spotbugsMain

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-analysis-reports
          path: |
            backend/build/reports/checkstyle/
            backend/build/reports/pmd/
            backend/build/reports/spotbugs/
          retention-days: 7

  build-push-backend:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    needs: backend-lint-and-format
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/istp-backend
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-push-frontend:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest
    needs: lint-and-format
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/istp-frontend
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-push-backend, build-push-frontend]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Write kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.STAGING_KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Set image tags and apply
        run: |
          SHA="${{ needs.build-push-backend.outputs.sha_short }}"
          sed -i "s/newTag: .*/newTag: $SHA/" k8s/overlays/staging/kustomization.yaml
          kubectl apply -k k8s/overlays/staging/

      - name: Wait for rollout
        run: |
          kubectl -n istp-staging rollout status deployment/backend --timeout=120s
          kubectl -n istp-staging rollout status deployment/frontend --timeout=120s

  cypress-e2e:
    name: Cypress E2E Tests (Staging)
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ${{ secrets.E2E_NEXTAUTH_SECRET }}
          AUTH_KEYCLOAK_ISSUER: https://istp-staging-auth.pm4.init-lab.ch/realms/interactive-security-training-platform
          AUTH_KEYCLOAK_ID: interactive-security-training-platform-app
          AUTH_KEYCLOAK_SECRET: ${{ secrets.E2E_AUTH_KEYCLOAK_SECRET }}
          KEYCLOAK_ADMIN_URL: https://istp-staging-auth.pm4.init-lab.ch/admin/interactive-security-training-platform/console/
          BACKEND_URL: https://istp-staging.pm4.init-lab.ch

      - name: Start Next.js app in background
        run: npm run start &
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ${{ secrets.E2E_NEXTAUTH_SECRET }}
          AUTH_KEYCLOAK_ISSUER: https://istp-staging-auth.pm4.init-lab.ch/realms/interactive-security-training-platform
          AUTH_KEYCLOAK_ID: interactive-security-training-platform-app
          AUTH_KEYCLOAK_SECRET: ${{ secrets.E2E_AUTH_KEYCLOAK_SECRET }}
          KEYCLOAK_ADMIN_URL: https://istp-staging-auth.pm4.init-lab.ch/admin/interactive-security-training-platform/console/
          BACKEND_URL: https://istp-staging.pm4.init-lab.ch

      - name: Wait for Next.js to be ready
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:3000 > /dev/null 2>&1; do sleep 2; done'
          echo "Next.js is ready"

      - name: Run Cypress E2E tests
        run: npm run test:e2e
        env:
          CYPRESS_KEYCLOAK_ORIGIN: https://istp-staging-auth.pm4.init-lab.ch
          CYPRESS_KEYCLOAK_REALM: interactive-security-training-platform
          CYPRESS_ADMIN_USERNAME: ${{ secrets.CYPRESS_ADMIN_USERNAME }}
          CYPRESS_ADMIN_PASSWORD: ${{ secrets.CYPRESS_ADMIN_PASSWORD }}
          CYPRESS_INSTRUCTOR_USERNAME: ${{ secrets.CYPRESS_INSTRUCTOR_USERNAME }}
          CYPRESS_INSTRUCTOR_PASSWORD: ${{ secrets.CYPRESS_INSTRUCTOR_PASSWORD }}
          CYPRESS_USER_USERNAME: ${{ secrets.CYPRESS_USER_USERNAME }}
          CYPRESS_USER_PASSWORD: ${{ secrets.CYPRESS_USER_PASSWORD }}

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          retention-days: 7

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: frontend/cypress/videos
          retention-days: 7
