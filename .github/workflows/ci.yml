name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  lint-and-format:
    name: Lint & Format Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier auto-fix
        run: npm run format

      - name: ESLint auto-fix
        run: npm run lint:fix

      - name: Commit lint/format fixes
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/
          git diff --staged --quiet || git commit -m "ci: auto-fix frontend lint and format [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done

  backend-lint-and-format:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Spotless auto-fix
        run: ./gradlew spotlessApply

      - name: Commit lint/format fixes
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/
          git diff --staged --quiet || git commit -m "ci: auto-fix backend spotless format [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done

      - name: Checkstyle
        run: ./gradlew checkstyleMain

      - name: PMD (warn only)
        run: ./gradlew pmdMain

      - name: SpotBugs (warn only)
        run: ./gradlew spotbugsMain

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-analysis-reports
          path: |
            backend/build/reports/checkstyle/
            backend/build/reports/pmd/
            backend/build/reports/spotbugs/
          retention-days: 7

  backend-test-and-sonar:
    name: Backend Tests & SonarQube
    runs-on: ubuntu-latest
    needs: [lint-and-format, backend-lint-and-format]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests and generate JaCoCo coverage report
        run: ./gradlew test jacocoTestReport

      - name: Run SonarQube analysis
        run: ./gradlew sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-push-backend:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    needs: [backend-lint-and-format, backend-test-and-sonar]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set short SHA
        id: vars
        run: echo "sha_short=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/istp-backend
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-push-frontend:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest
    needs: lint-and-format
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/istp-frontend
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifests:
    name: Update K8s Manifests
    runs-on: ubuntu-latest
    needs: [build-push-backend, build-push-frontend]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout deploy-staging
        uses: actions/checkout@v4
        with:
          ref: deploy-staging

      - name: Update image tags in staging
        run: |
          SHA="${{ needs.build-push-backend.outputs.sha_short }}"
          sed -i "s/newTag: .*/newTag: $SHA/" k8s/overlays/staging/kustomization.yaml

      - name: Commit and push manifest changes
        run: |
          SHA="${{ needs.build-push-backend.outputs.sha_short }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/staging/kustomization.yaml
          git diff --staged --quiet || git commit -m "ci(deploy): update staging to $SHA [skip ci]"
          git push origin deploy-staging

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: update-manifests
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout deploy-staging branch
        uses: actions/checkout@v4
        with:
          ref: deploy-staging

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Set kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig.yaml

      - name: Deploy to cluster
        run: |
          kubectl --kubeconfig=kubeconfig.yaml apply -k k8s/overlays/staging

  playwright-e2e:
    name: Playwright E2E Tests (Staging)
    runs-on: ubuntu-latest
    needs: update-manifests
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js app
        run: npm run build
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ${{ secrets.E2E_NEXTAUTH_SECRET }}
          AUTH_KEYCLOAK_ISSUER: https://istp-staging-auth.pm4.init-lab.ch/realms/interactive-security-training-platform
          AUTH_KEYCLOAK_ID: interactive-security-training-platform-app
          AUTH_KEYCLOAK_SECRET: ${{ secrets.E2E_AUTH_KEYCLOAK_SECRET }}
          KEYCLOAK_ADMIN_URL: https://istp-staging-auth.pm4.init-lab.ch/admin/interactive-security-training-platform/console/
          BACKEND_URL: https://istp-staging.pm4.init-lab.ch

      - name: Start Next.js app in background
        run: npm run start &
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ${{ secrets.E2E_NEXTAUTH_SECRET }}
          AUTH_KEYCLOAK_ISSUER: https://istp-staging-auth.pm4.init-lab.ch/realms/interactive-security-training-platform
          AUTH_KEYCLOAK_ID: interactive-security-training-platform-app
          AUTH_KEYCLOAK_SECRET: ${{ secrets.E2E_AUTH_KEYCLOAK_SECRET }}
          KEYCLOAK_ADMIN_URL: https://istp-staging-auth.pm4.init-lab.ch/admin/interactive-security-training-platform/console/
          BACKEND_URL: https://istp-staging.pm4.init-lab.ch

      - name: Wait for Next.js to be ready
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:3000 > /dev/null 2>&1; do sleep 2; done'
          echo "Next.js is ready"

      - name: Run Playwright E2E tests
        run: npm run test:e2e -- --project=chromium
        env:
          BASE_URL: http://localhost:3000
          CYPRESS_ADMIN_USERNAME: ${{ secrets.CYPRESS_ADMIN_USERNAME }}
          CYPRESS_ADMIN_PASSWORD: ${{ secrets.CYPRESS_ADMIN_PASSWORD }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  promote-to-prod:
    name: Promote to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    permissions:
      contents: write

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: deploy-staging

      - name: Get current image tag
        id: tag
        run: |
          TAG=$(grep newTag k8s/overlays/staging/kustomization.yaml | awk '{print $2}')
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Checkout prod
        uses: actions/checkout@v4
        with:
          ref: deploy-prod

      - name: Update prod to staging version
        run: |
          sed -i "s/newTag: .*/newTag: ${{ steps.tag.outputs.tag }}/" k8s/overlays/prod/kustomization.yaml

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "ci(deploy): promote to prod ${{ steps.tag.outputs.tag }}" || echo "no changes"
          git push origin deploy-prod
  