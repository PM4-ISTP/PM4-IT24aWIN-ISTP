name: Frontend E2E

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Playwright project to run"
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit

jobs:
  playwright-e2e:
    name: Playwright E2E (${{ inputs.project }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ inputs.project }}

      - name: Build Next.js app
        run: npm run build
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ${{ secrets.E2E_NEXTAUTH_SECRET }}
          AUTH_KEYCLOAK_ISSUER: https://istp-staging-auth.pm4.init-lab.ch/realms/interactive-security-training-platform
          AUTH_KEYCLOAK_ID: interactive-security-training-platform-app
          AUTH_KEYCLOAK_SECRET: ${{ secrets.E2E_AUTH_KEYCLOAK_SECRET }}
          KEYCLOAK_ADMIN_URL: https://istp-staging-auth.pm4.init-lab.ch/admin/interactive-security-training-platform/console/
          BACKEND_URL: https://istp-staging.pm4.init-lab.ch

      - name: Start Next.js app in background
        run: npm run start &
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ${{ secrets.E2E_NEXTAUTH_SECRET }}
          AUTH_KEYCLOAK_ISSUER: https://istp-staging-auth.pm4.init-lab.ch/realms/interactive-security-training-platform
          AUTH_KEYCLOAK_ID: interactive-security-training-platform-app
          AUTH_KEYCLOAK_SECRET: ${{ secrets.E2E_AUTH_KEYCLOAK_SECRET }}
          KEYCLOAK_ADMIN_URL: https://istp-staging-auth.pm4.init-lab.ch/admin/interactive-security-training-platform/console/
          BACKEND_URL: https://istp-staging.pm4.init-lab.ch

      - name: Wait for Next.js to be ready
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:3000 > /dev/null 2>&1; do sleep 2; done'
          echo "Next.js is ready"

      - name: Run Playwright E2E tests
        run: npm run test:e2e -- --project=${{ inputs.project }}
        env:
          BASE_URL: http://localhost:3000
          E2E_ADMIN_USERNAME: ${{ secrets.E2E_ADMIN_USERNAME }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_INSTRUCTOR_USERNAME: ${{ secrets.E2E_INSTRUCTOR_USERNAME }}
          E2E_INSTRUCTOR_PASSWORD: ${{ secrets.E2E_INSTRUCTOR_PASSWORD }}
          E2E_STUDENT_USERNAME: ${{ secrets.E2E_STUDENT_USERNAME }}
          E2E_STUDENT_PASSWORD: ${{ secrets.E2E_STUDENT_PASSWORD }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ inputs.project }}
          path: frontend/playwright-report/
          retention-days: 7
