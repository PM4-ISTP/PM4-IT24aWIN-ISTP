services:
  # Our PostgreSQL database
  db:
    # WARNING: No volume configured - data will be lost after container restart!
    # For persistent data, add: volumes: - postgres-data:/var/lib/postgresql/data
    image: postgres:17
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}

  # Database management interface (Adminer)
  # Access at http://localhost:8888
  adminer:
    image: adminer:4.8.1
    restart: always
    ports:
      - 8888:8080
