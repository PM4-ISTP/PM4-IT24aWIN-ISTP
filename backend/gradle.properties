# google-java-format uses internal javac APIs that are encapsulated by the JDK module
# system from JDK 16 onwards. These --add-exports flags grant the Gradle daemon access
# to those packages at startup, which Spotless inherits when it runs the formatter
# in-process. Without these, google-java-format throws InaccessibleObjectException
# (JDK 16-23) or NoSuchMethodError on internal API changes (JDK 24+).
org.gradle.jvmargs=\
  --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
