spring.application.name=istp

# Database Connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
# In production, set DB_PASSWORD via environment variables or Kubernetes secrets.
spring.datasource.password=${DB_PASSWORD:root}

# JPA Configuration
# WARNING: 'update' is only suitable for local development.
# For production, use 'validate' or a migration tool like Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Jackson Configuration
# Omits JSON properties with null values from responses, because the OpenAPI types do not include null values.
spring.jackson.default-property-inclusion=non_null

# Local Keycloak instance - adjust for production environment
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/interactive-security-training-platform

# Logging
logging.level.com.pm4.istp=INFO
logging.level.root=WARN

# Kubernetes configuration
k8s.default.namespace=${KUBERNETES_NAMESPACE:default}

istp.domain=${ISTP_DOMAIN:127.0.0.1.nip.io}
istp.tls=${ISTP_TLS:false}

# Maximum number of active course topics allowed
istp.topics.max-count=50

# CORS
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# Keycloak Admin API (service account; never use direct DB access)
keycloak.admin.base-url=http://localhost:9090
keycloak.admin.realm=interactive-security-training-platform
keycloak.admin.client-id=istp-backend
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}

# Keycloak App Client (used for listing active sessions for the ISTP app in the admin dashboard)
# Must match the OIDC clientId used by the frontend login flow in Keycloak.
keycloak.app.client-id=interactive-security-training-platform-app

# Keycloak UserInfo enrichment (used only when required claims are missing in the JWT)
# In production you can disable this if your JWT always includes required profile claims.
istp.userinfo.enabled=${ISTP_USERINFO_ENABLED:true}
istp.userinfo.timeout=${ISTP_USERINFO_TIMEOUT:2s}
