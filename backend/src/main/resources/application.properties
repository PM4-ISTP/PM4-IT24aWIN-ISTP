spring.application.name=istp

# Local-only overrides:
# Put secrets into `backend/src/main/resources/application-local.properties` (gitignored)
# Example: keycloak.admin.client-secret=...
spring.config.import=optional:classpath:application-local.properties

# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
# TODO: Use environment variables or a secrets manager in production!
spring.datasource.password=root

# JPA Configuration
# WARNING: 'update' is only suitable for local development.
# For production, use 'validate' or a migration tool like Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Jackson Configuration
# Omits JSON properties with null values from responses, because the OpenAPI types do not include null values.
spring.jackson.default-property-inclusion=non_null

# Keycloak issuer (JWT validation)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:https://istp-staging-auth.pm4.init-lab.ch/realms/interactive-security-training-platform}

# Keycloak Admin API (service account; never use direct DB access)
keycloak.admin.base-url=${KEYCLOAK_BASE_URL:https://istp-staging-auth.pm4.init-lab.ch}
keycloak.admin.realm=${KEYCLOAK_REALM:interactive-security-training-platform}
keycloak.admin.client-id=istp-backend
# Put the secret into `backend/src/main/resources/application-local.properties` (gitignored)
# or export it as env var `KEYCLOAK_ADMIN_CLIENT_SECRET`.
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}

# Keycloak App Client (used for listing active sessions for the ISTP app in the admin dashboard)
# Must match the OIDC clientId used by the frontend login flow in Keycloak.
keycloak.app.client-id=${KEYCLOAK_APP_CLIENT_ID:interactive-security-training-platform-app}

# Logging
logging.level.com.pm4.istp=INFO
logging.level.root=WARN

# Kubernetes configuration
k8s.default.namespace=${KUBERNETES_NAMESPACE:default}

istp.domain=${ISTP_DOMAIN:127.0.0.1.nip.io}
istp.tls=${ISTP_TLS:false}

# Maximum number of active course topics allowed
istp.topics.max-count=50

# CORS
cors.allowed-origin=http://localhost:3000
