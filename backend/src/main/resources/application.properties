spring.application.name=istp

# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
# TODO: Use environment variables or a secrets manager in production!
spring.datasource.password=root

# JPA Configuration
# WARNING: 'update' is only suitable for local development.
# For production, use 'validate' or a migration tool like Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Local Keycloak instance - adjust for production environment
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/interactive-security-training-platform
