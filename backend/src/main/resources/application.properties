spring.application.name=istp

# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
# TODO: Use environment variables or a secrets manager in production!
spring.datasource.password=root

# JPA Configuration
# WARNING: 'update' is only suitable for local development.
# For production, use 'validate' or a migration tool like Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Local Keycloak instance - adjust for production environment
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/interactive-security-training-platform

# Keycloak Admin REST API (service account / client credentials)
# Override via environment variables in production.
# KEYCLOAK_URL            - base URL of the Keycloak server
# KEYCLOAK_REALM          - realm that the backend manages
# KEYCLOAK_ADMIN_CLIENT_ID     - client ID of the service account
# KEYCLOAK_ADMIN_CLIENT_SECRET - client secret of the service account
keycloak.admin.server-url=${KEYCLOAK_URL:http://localhost:9090}
keycloak.admin.realm=${KEYCLOAK_REALM:interactive-security-training-platform}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:interactive-security-training-platform-app}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}

# Logging
logging.level.com.pm4.istp=INFO
logging.level.root=WARN

# Kubernetes configuration
k8s.kubeconfig.path=src/main/resources/Kubeconfig
k8s.default.namespace=default
