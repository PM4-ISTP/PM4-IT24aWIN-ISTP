apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: istp-prod

resources:
  - ../../base
  - ingress.yaml

images:
  - name: istp-backend
    newName: ghcr.io/pm4-istp/istp-backend
    newTag: sha-e50d657
  - name: istp-frontend
    newName: ghcr.io/pm4-istp/istp-frontend
    newTag: sha-e50d657

configMapGenerator:
  - name: istp-config
    literals:
      - keycloak-hostname=istp-auth.pm4.init-lab.ch
      - keycloak-issuer-uri=https://istp-auth.pm4.init-lab.ch/realms/interactive-security-training-platform
      - app-namespace=istp-prod
      - keycloak-admin-url=https://istp-auth.pm4.init-lab.ch/admin/interactive-security-training-platform/console/
      - istp-domain=pm4.init-lab.ch
      - istp-tls=true
      - keycloak-client-id=interactive-security-training-platform-app
      - nextauth-url=https://istp.pm4.init-lab.ch
      - backend-url=http://backend:8080
      - cors-allowed-origin=https://istp.pm4.init-lab.ch

# ┌─────────────────────────────────────────────────────────────────────┐
# │ Manual secrets (create once per namespace, not managed by Kustomize)│
# │                                                                     │
# │ 1. ghcr-pull-secret — pull images from ghcr.io                     │
# │    kubectl create secret docker-registry ghcr-pull-secret \         │
# │      --docker-server=ghcr.io \                                     │
# │      --docker-username=<github-user> \                              │
# │      --docker-password=<PAT-with-read:packages> \                  │
# │      -n istp-prod                                                   │
# │                                                                     │
# │ 2. kubeconfig — K8s auth for challenge pod creation                │
# │    kubectl create secret generic kubeconfig \                       │
# │      --from-file=kubeconfig=<path-to-kubeconfig> \                 │
# │      -n istp-prod                                                   │
# │                                                                     │
# │ 3. postgres-credentials — Database credentials                      │
# │    kubectl create secret generic postgres-credentials \             │
# │      --from-literal=username=postgres \                             │
# │      --from-literal=password=<db-password> \                        │
# │      -n istp-prod                                                   │
# │                                                                     │
# │ 4. keycloak-credentials — Keycloak admin credentials                │
# │    kubectl create secret generic keycloak-credentials \             │
# │      --from-literal=admin-username=admin \                          │
# │      --from-literal=admin-password=<keycloak-password> \            │
# │      -n istp-prod                                                   │
# │                                                                     │
# │ 5. nextauth-secret — NextAuth signing secret + Keycloak client      │
# │    kubectl create secret generic nextauth-secret \                  │
# │      --from-literal=NEXTAUTH_SECRET=<nextauth-secret> \             │
# │      --from-literal=AUTH_KEYCLOAK_SECRET=<keycloak-client-secret> \ │
# │      -n istp-prod                                                   │
# └─────────────────────────────────────────────────────────────────────┘
