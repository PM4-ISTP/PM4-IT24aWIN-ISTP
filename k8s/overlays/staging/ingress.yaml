# Ingress for staging environment
# Wildcard cert *.pm4.init-lab.ch is configured at the cluster level — no TLS section needed.
# Uses the default IngressClass (NGINX).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: istp-ingress
  labels:
    app.kubernetes.io/part-of: istp
spec:
  rules:
    # Main app: frontend + backend API on same host (avoids CORS issues)
    - host: istp-staging.pm4.init-lab.ch
      http:
        paths:
          # NextAuth routes must be handled by the frontend — must come before /api
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
          # Next.js API proxy routes must be handled by the frontend — must come before /api
          - path: /api/backend
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
          # Public API documentation on staging (no login required)
          - path: /scalar
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /v3/api-docs.yaml
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    # Keycloak on separate subdomain (avoids path-prefix complexity)
    - host: istp-staging-auth.pm4.init-lab.ch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
    # Adminer on separate subdomain
    - host: istp-staging-adminer.pm4.init-lab.ch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adminer
                port:
                  number: 8080
