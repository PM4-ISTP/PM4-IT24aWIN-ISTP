apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: istp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: istp
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret # created manually, see README
      containers:
        - name: backend
          image: istp-backend # replaced by overlay kustomization
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/istp
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: istp-config
                  key: keycloak-issuer-uri
            - name: KEYCLOAK_URL
              valueFrom:
                configMapKeyRef:
                  name: istp-config
                  key: keycloak-url
            - name: KEYCLOAK_REALM
              valueFrom:
                configMapKeyRef:
                  name: istp-config
                  key: keycloak-realm
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: istp-config
                  key: keycloak-client-id
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nextauth-secret
                  key: AUTH_KEYCLOAK_SECRET
            - name: K8S_KUBECONFIG_PATH
              value: /etc/kubeconfig/kubeconfig
            - name: K8S_DEFAULT_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: istp-config
                  key: app-namespace
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/kubeconfig
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: kubeconfig
          secret:
            secretName: kubeconfig # created manually, see README
