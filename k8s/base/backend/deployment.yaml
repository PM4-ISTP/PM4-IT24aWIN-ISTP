apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: istp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: istp
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret # created manually, see README
      containers:
        - name: backend
          image: istp-backend # replaced by overlay kustomization
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/istp
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: istp-config
                  key: keycloak-issuer-uri
            - name: KEYCLOAK_ADMIN_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: istp-config
                  key: keycloak-admin-base-url
            - name: KEYCLOAK_ADMIN_REALM
              valueFrom:
                configMapKeyRef:
                  name: istp-config
                  key: keycloak-realm
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: istp-config
                  key: keycloak-admin-client-id
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-api-client
                  key: client-secret
            - name: KEYCLOAK_APP_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: istp-config
                  key: keycloak-client-id
            - name: K8S_DEFAULT_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: istp-config
                  key: app-namespace
            - name: ISTP_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: istp-config
                  key: istp-domain
            - name: ISTP_TLS
              valueFrom:
                configMapKeyRef:
                  name: istp-config
                  key: istp-tls
            - name: ISTP_LAB_HOST_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: istp-config
                  key: istp-lab-host-prefix
                  optional: true
            - name: ISTP_POD_EXTENSION_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: istp-config
                  key: istp-pod-extension-seconds
                  optional: true
            - name: ISTP_POD_MAX_EXTENSIONS
              valueFrom:
                configMapKeyRef:
                  name: istp-config
                  key: istp-pod-max-extensions
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
